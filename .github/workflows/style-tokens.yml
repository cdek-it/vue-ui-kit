name: Style Tokens Check

on:
  pull_request:
  push:

jobs:
  style-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run install
        uses: borales/actions-yarn@v4
        with:
          cmd: install

      - name: Check Design Token Conflicts
        run: yarn check:token-conflicts

      - name: Build Storybook + Check Style Tokens
        run: yarn check:style-tokens

